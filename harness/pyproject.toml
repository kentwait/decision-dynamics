[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-bench"
version = "0.1.0"
description = "Benchmark harness for decision models vs LLMs vs humans"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
laya = [
    "torch>=2.0",
    "transformers>=4.40",
    "safetensors>=0.4",
]
frontier = [
    "openai>=1.0",
    "anthropic>=0.30",
]
local = [
    "ollama>=0.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
decision-bench = "decision_bench.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_bench"]

[tool.ruff]
line-length = 100
target-version = "py310"
